name: Deploy Azure Function App

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/azure-functionapp.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/azure-functionapp.yml"

env:
  DOTNET_VERSION: "10.0.x"
  FUNCTION_PROJECT: "backend/PublicTransportWalkingApi/PublicTransportWalking/PublicTransportWalking.csproj"
  ARTIFACT_NAME: "function-app-package"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish function app
        run: dotnet publish "${{ env.FUNCTION_PROJECT }}" --configuration Release --output ./publish

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./publish
          include-hidden-files: true

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./publish

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ./publish
